# client-react's own nginx.conf (06-demo-application/client-react/nginx.conf in the course repo),
# with one change: /api/node/ goes to a list of api-node containers (upstream), not to one name.
# This list is the load balancer's list. When the containers change, someone edits it and reloads nginx.
upstream api_node {
    server api-node-1:3000;
    server api-node-2:3000;
}

server {
  listen 8080;

  location /ping {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "pong";
  }
  location /api/golang/ {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        rewrite ^/api-golang/(.*) /$1 break;
        proxy_pass http://api-golang:8000/;
  }
  location /api/node/ {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        rewrite ^/api/node/(.*) /$1 break;
        proxy_pass http://api_node/;
        proxy_connect_timeout 1s;
        # which api-node container answered (probe.py counts them)
        add_header X-Upstream $upstream_addr always;
  }
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }
}
