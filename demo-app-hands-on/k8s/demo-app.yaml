# The demo app on Kubernetes: the same five images as in part A, and the same names.
# db, api-node and api-golang are Service names here, so DATABASE_URL and client-react's nginx.conf work unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: db
stringData:
  POSTGRES_PASSWORD: foobarbaz
  DATABASE_URL: postgres://postgres:foobarbaz@db:5432/postgres
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      nodeSelector:
        tier: data
      containers:
        - name: postgres
          image: postgres:16.3-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrator
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: demo-app/db-migrator:0.1
          args: ["-path=/app/migrations", "-database=$(DATABASE_URL)?sslmode=disable", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db
                  key: DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      containers:
        - name: api-node
          image: demo-app/api-node:0.1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db
                  key: DATABASE_URL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ping
              port: 3000
            periodSeconds: 1
          # Part B, step 3: remove the # from the next four lines.
          # api-node closes its port the moment it gets SIGTERM, but the Service can still send it requests
          # for a second or two. Waiting 5 s before the SIGTERM lets the pod leave the Service first.
          # lifecycle:
          #   preStop:
          #     exec:
          #       command: ["sleep", "5"]
      # spread the copies over the two workers
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-node
      # a pod on a node that stopped answering is moved after 20 s (the default is 300 s)
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-node
spec:
  selector:
    app: api-node
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-golang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-golang
  template:
    metadata:
      labels:
        app: api-golang
    spec:
      nodeSelector:
        tier: data
      containers:
        - name: api-golang
          image: demo-app/api-golang:0.1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-golang
spec:
  selector:
    app: api-golang
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-react
  template:
    metadata:
      labels:
        app: client-react
    spec:
      nodeSelector:
        tier: data
      containers:
        - name: client-react
          image: demo-app/client-react:0.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: client-react
spec:
  type: NodePort
  selector:
    app: client-react
  ports:
    - port: 8080
      nodePort: 30080
